<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>01 Hero 畫面提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* 01 Hero mockup for the deck, 1440×810: plays version A (hero-d2, type-led) then version B (hero-a2, laptop) and loops.
     Restarts from A on { deck: 'play', at: 'land' }. */
  *{box-sizing:border-box}
  html,body{margin:0;width:1440px;height:810px;overflow:hidden;background:#fff;font-family:'Noto Sans TC',sans-serif}
  iframe{position:absolute;left:0;top:0;width:1440px;height:810px;border:0;opacity:0;transition:opacity .6s}
  iframe.on{opacity:1}
  .ver{position:absolute;left:28px;top:24px;z-index:2;display:flex;gap:8px}
  .ver span{padding:6px 16px;border-radius:999px;border:1.5px solid #1a1d23;background:#fff;color:#1a1d23;font:700 17px 'Noto Sans TC',sans-serif;transition:all .4s}
  .ver span b{font:800 17px Montserrat,sans-serif;margin-right:6px}
  .ver span.on{background:#1a1d23;color:#fff}
</style>
</head>
<body>
<iframe id="fa" src="hero-d2.html?deck&v=20260929-9" title="版本 A" scrolling="no" tabindex="-1"></iframe>
<iframe id="fb" src="hero-a2.html?deck&v=20260929-9" title="版本 B" scrolling="no" tabindex="-1"></iframe>
<div class="ver"><span id="la"><b>A</b>字體主視覺</span><span id="lb"><b>B</b>從筆電探頭</span></div>
<script>
  // each version waits for 'play' (?deck) and says 'ready' once loaded; a version starts, and its time counts, only
  // when it is both on screen and ready. The deck's { play, land } starts from A; opened on its own it starts on load.
  const V = [['fa', 'la', 10000], ['fb', 'lb', 8500]], ready = {};
  let n = -1, timer;
  const run = i => {
    clearTimeout(timer);
    document.getElementById(V[i][0]).contentWindow.postMessage({ deck: 'play', at: 'land' }, '*');
    timer = setTimeout(() => show((i + 1) % V.length), V[i][2]);
  };
  const show = i => {
    clearTimeout(timer); n = i;
    V.forEach(([f, l], k) => { document.getElementById(f).classList.toggle('on', k === i); document.getElementById(l).classList.toggle('on', k === i); });
    if (ready[V[i][0]]) run(i);
  };
  addEventListener('message', e => {
    const d = e.data; if (!d) return;
    if (d.deck === 'ready') {
      const f = V.find(([id]) => document.getElementById(id).contentWindow === e.source); if (!f) return;
      ready[f[0]] = true; if (n >= 0 && V[n][0] === f[0]) run(n);
    } else if (d.deck === 'play' && d.at === 'land') show(0);
  });
  // in the deck, wait for its land message (with a fallback); on its own, start right away
  if (parent === self) show(0); else setTimeout(() => { if (n < 0) show(0); }, 2500);
</script>
</body>
</html>
