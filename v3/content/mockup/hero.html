<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>L1-1 Hero 畫面提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* L1-1 hero mockup, 1440×810, white canvas. Plays on load; inside the deck it restarts on { deck: 'play' }. */
  *{box-sizing:border-box}
  html,body{margin:0;width:1440px;height:810px;overflow:hidden;background:#fff;font-family:'Noto Sans TC',sans-serif;color:#1a1d23}
  .stage{position:relative;width:1440px;height:810px}
  .t{transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
  .hide{opacity:0;transform:translateY(24px)}
  h1{position:absolute;left:0;right:0;top:74px;margin:0;text-align:center;font:900 112px/1 Montserrat,sans-serif;letter-spacing:-2px}
  h1 em{font-style:normal;color:#83b81a}
  h1.hide{transform:scale(.9)}
  .sub{position:absolute;left:0;right:0;top:212px;margin:0;text-align:center;font-size:26px;font-weight:500;color:#3d4250}
  /* laptop in front, Qubi behind its lid: Qubi rises from behind the top edge of the screen */
  .device{position:absolute;left:50%;top:410px;width:470px;margin-left:-235px}
  .device img.laptop{position:relative;z-index:2;display:block;width:470px}
  .qubi{position:absolute;z-index:1;left:50%;top:0;width:160px;margin-left:-80px;transform:translateY(150px);transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
  .qubi.up{transform:translateY(-112px)}
  .qubi.nod{animation:nod 1.4s ease-in-out}
  @keyframes nod{0%,100%{transform:translateY(-112px) rotate(0)}30%{transform:translateY(-118px) rotate(-6deg)}65%{transform:translateY(-110px) rotate(5deg)}}
  .shadow{position:absolute;left:50%;top:752px;width:500px;height:18px;margin-left:-250px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.14),transparent 70%)}
</style>
</head>
<body>
<div class="stage">
  <h1 class="t hide" id="title">Hey <em>Qubi</em>!</h1>
  <p class="sub t hide" id="sub">Acer Intelligence Space，你的 AI 助理就在電腦裡</p>
  <div class="device t hide" id="device">
    <img class="qubi" id="qubi" src="qubi.png" alt="Qubi">
    <img class="laptop" src="laptop.png" alt="Acer Aspire Lite 14">
  </div>
  <div class="shadow"></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  function play() {
    timers.splice(0).forEach(clearTimeout);
    ['device', 'title', 'sub'].forEach(id => $(id).classList.add('hide'));
    $('qubi').classList.remove('up', 'nod');
    at(200, () => $('device').classList.remove('hide'));      // laptop settles in
    at(900, () => $('qubi').classList.add('up'));             // Qubi peeks out from behind the lid
    at(1500, () => $('title').classList.remove('hide'));      // "Hey Qubi!"
    at(2100, () => $('qubi').classList.add('nod'));           // small hello nod
    at(2400, () => $('sub').classList.remove('hide'));
    at(9000, play);                                           // loop
  }
  addEventListener('message', e => { if (e.data && e.data.deck === 'play' && e.data.at === 'land') play(); });
  play();
</script>
</body>
</html>
