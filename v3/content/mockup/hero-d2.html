<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Hero D2 · 字體主視覺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-base.css?v=20260929-10">
<style>
  /* D2: type-led, no laptop. A huge green "Qubi" wordmark (the same Montserrat glyphs as the headline) drops in letter
     by letter; the counter of the Q lights up and the 3D Qubi rises in it with its head leaning out over the Q's frame,
     like out of a window. It looks around and jumps out to the centre while the wordmark shrinks down into the "Qubi"
     of the headline; the rest of the headline fades in as Qubi waves */
  .word{position:absolute;left:170px;top:120px;width:1100px;height:420px;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.3,.8,.2,1),opacity .35s}
  .word svg{width:100%;height:100%;overflow:visible}
  .word .l{transform-box:fill-box;transform-origin:50% 100%;transform:translateY(-260px);opacity:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .3s}
  .word .l.in{transform:none;opacity:1}
  .word.gone{opacity:0}
  .hole{transition:fill .5s}
  .word text{font:900 400px Montserrat,sans-serif;fill:#83b81a}
  .copy{position:absolute;left:0;right:0;top:596px;text-align:center}
  .copy h1{font-size:72px}
  .copy em{opacity:0}
  .copy em.on{opacity:1}
  .copy .sub{margin-top:14px}
  canvas{position:absolute;left:0;top:0;width:1440px;height:810px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="stage">
  <div class="word" id="word">
    <svg viewBox="0 0 1100 420">
      <ellipse class="hole" id="hole" fill="#fff"/>
      <text class="l">Q</text><text class="l">u</text><text class="l">b</text><text class="l">i</text>
    </svg>
  </div>
  <canvas id="c"></canvas>
  <div class="copy" id="copy"><h1><span class="t hide" id="s1">Acer </span><em id="qw">Qubi</em><span class="t hide" id="s2"> 全新亮相!</span></h1>
    <p class="sub t hide" id="sub">新一代 Acer Intelligence Space 與 Acer Qubi 就在你的電腦裡，幫你做得更多、更懂你。</p></div>
  <span class="tag">D2 · 字體主視覺</span>
</div>
<script type="module">
  import { createStage, loopScene } from './qubi3d.js?v=20260929-10';
  const $ = id => document.getElementById(id), cv = $('c'), word = $('word');
  const letters = [...document.querySelectorAll('.l')];
  await document.fonts.load('900 400px Montserrat');
  // lay the four glyphs out exactly like the headline's "Qubi": same font, letter-spacing scaled to 400px, baseline 370
  const BASE = 370, em = $('qw'), emFs = parseFloat(getComputedStyle(em).fontSize);
  const ls = (parseFloat(getComputedStyle(em).letterSpacing) || 0) * 400 / emFs;
  const probe = document.createElementNS('http://www.w3.org/2000/svg', 'text'); probe.textContent = 'Qubi';
  probe.style.letterSpacing = ls + 'px'; letters[0].parentNode.appendChild(probe);
  const X0 = (1100 - probe.getComputedTextLength()) / 2;
  letters.forEach((l, i) => { l.setAttribute('x', X0 + probe.getStartPositionOfChar(i).x); l.setAttribute('y', BASE); });
  probe.remove();
  // find the Q's counter (the window Qubi rises in): draw the Q and flood the white inside it
  const counter = (() => {
    const k = document.createElement('canvas'); k.width = 1100; k.height = 420; const x = k.getContext('2d', { willReadFrequently: true });
    x.font = '900 400px Montserrat'; x.fillText('Q', X0, BASE);
    const d = x.getImageData(0, 0, 1100, 420).data, ink = i => d[i * 4 + 3] > 128;
    let L = 1100, R = 0, T = 420; for (let i = 0; i < 1100 * 420; i++) if (ink(i)) { const px = i % 1100, py = (i / 1100) | 0; L = Math.min(L, px); R = Math.max(R, px); T = Math.min(T, py); }
    const seed = Math.round((T + BASE) / 2) * 1100 + Math.round(L + (R - L) * .45), seen = new Uint8Array(1100 * 420), st = [seed];
    let a = 1100, b = 0, t = 420, u = 0;
    while (st.length) { const i = st.pop(); if (seen[i] || ink(i)) continue; seen[i] = 1; const px = i % 1100, py = (i / 1100) | 0;
      a = Math.min(a, px); b = Math.max(b, px); t = Math.min(t, py); u = Math.max(u, py); st.push(i - 1, i + 1, i - 1100, i + 1100); }
    return { cx: (a + b) / 2, cy: (t + u) / 2, rx: (b - a) / 2, ry: (u - t) / 2 };
  })();
  Object.entries({ cx: counter.cx, cy: counter.cy, rx: counter.rx + 6, ry: counter.ry + 6 }).forEach(([k, v]) => $('hole').setAttribute(k, v));
  // the counter in page px (word box at 170,120)
  const QX = 170 + counter.cx, QY = 120 + counter.cy, RX = counter.rx, RY = counter.ry;
  // clip for Qubi inside the Q: everything above the counter's centre line (the head leans out over the frame)
  // plus the lower half of the counter (the body stays inside the window)
  const arc = Array.from({ length: 25 }, (_, i) => { const a = Math.PI * i / 24; return `${(QX + RX * Math.cos(a)).toFixed(1)}px ${(QY + RY * Math.sin(a)).toFixed(1)}px`; });
  const WINDOW = `polygon(0 0, 1440px 0, 1440px ${QY}px, ${arc.join(', ')}, 0 ${QY}px)`;
  // transform that lays the wordmark exactly over the "Qubi" of the headline (same glyphs, scaled; same start and baseline)
  const toHeadline = () => {
    const r = em.getBoundingClientRect(), s = emFs / 400;
    return `translate(${r.left - 170 - s * X0}px, ${r.top + .968 * emFs - 120 - s * BASE}px) scale(${s})`;
  };
  // Qubi sized so its head is wider than the window; feet low enough that the neck sits on the centre line
  const SIZE = Math.round(RX * 2 * 1.9), UP = QY + SIZE * .3, BIG = 230;
  const q = createStage(cv).add({ x: QX, y: 780, size: SIZE });
  loopScene(() => {
    letters.forEach(l => l.classList.remove('in'));
    word.style.transition = 'none'; word.style.transform = ''; word.classList.remove('gone'); word.offsetWidth; word.style.transition = '';
    $('hole').setAttribute('fill', '#fff'); $('qw').classList.remove('on');
    ['s1', 's2', 'sub'].forEach(id => $(id).classList.add('hide'));
    q.reset(QX, 780); q.setSize(SIZE); cv.style.clipPath = WINDOW;
  }, async (wait, live) => {
    for (const l of letters) { await wait(180); l.classList.add('in'); }      // green letters drop in
    await wait(700); $('hole').setAttribute('fill', '#f1f8e6');               // the Q's window lights up
    await wait(250); await q.rise(UP, .9); if (!live()) return;               // Qubi leans out of the Q
    await q.lookAround(); if (!live()) return;                                // looks around, then jumps out
    cv.style.clipPath = '';
    setTimeout(() => { if (live()) word.style.transform = toHeadline(); }, 200);   // the wordmark shrinks into the headline
    q.tween(1.05, t => q.setSize(SIZE + (BIG - SIZE) * t));                     // grows to full size on the way
    await q.jumpTo(720, 548, { height: 170, dur: .9 }); if (!live()) return;
    $('qw').classList.add('on'); word.classList.add('gone');
    $('s1').classList.remove('hide'); $('s2').classList.remove('hide');
    q.wave(3);                                                                 // waves while the headline comes in
    await wait(300); $('sub').classList.remove('hide');
  }, 12000);
</script>
</body>
</html>
