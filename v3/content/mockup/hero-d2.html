<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Hero D2 · 字體主視覺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-base.css?v=20260929-6">
<style>
  /* D2: type-led, no laptop. A huge green "Qubi" wordmark drops in letter by letter; the counter of the Q lights up
     and the 3D Qubi rises in it with its head leaning out over the Q's frame, like out of a window. Qubi jumps out to
     the centre while the wordmark shrinks down into the "Qubi" of the headline below it */
  .word{position:absolute;left:170px;top:120px;width:1100px;height:420px;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.3,.8,.2,1),opacity .35s}
  .word svg{width:100%;height:100%;overflow:visible}
  .word .l{transform-box:fill-box;transform-origin:50% 100%;transform:translateY(-260px);opacity:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .3s}
  .word .l.in{transform:none;opacity:1}
  .word.gone{opacity:0}
  .hole{transition:fill .5s}
  .copy{position:absolute;left:0;right:0;top:596px;text-align:center}
  .copy h1{font-size:72px}
  .copy em{opacity:0}
  .copy em.on{opacity:1}
  .copy .sub{margin-top:14px}
  canvas{position:absolute;left:0;top:0;width:1440px;height:810px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="stage">
  <div class="word" id="word">
    <svg viewBox="0 0 1100 420">
      <g class="l" id="lq">
        <circle cx="210" cy="215" r="158" fill="#83b81a"/>
        <circle class="hole" id="hole" cx="210" cy="215" r="98" fill="#fff"/>
        <path d="M285 300 L385 395 L330 410 L240 330 Z" fill="#83b81a"/>
      </g>
      <text class="l" x="400" y="370" style="font:900 400px Montserrat,sans-serif;fill:#83b81a">u</text>
      <text class="l" x="660" y="370" style="font:900 400px Montserrat,sans-serif;fill:#83b81a">b</text>
      <text class="l" x="920" y="370" style="font:900 400px Montserrat,sans-serif;fill:#83b81a">i</text>
    </svg>
  </div>
  <canvas id="c"></canvas>
  <div class="copy" id="copy"><h1><span class="t hide" id="s1">Acer </span><em id="qw">Qubi</em><span class="t hide" id="s2"> 全新亮相!</span></h1>
    <p class="sub t hide" id="sub">新一代 Acer Intelligence Space 與 Acer Qubi 就在你的電腦裡，幫你做得更多、更懂你。</p></div>
  <span class="tag">D2 · 字體主視覺</span>
</div>
<script type="module">
  import { createStage, loopScene } from './qubi3d.js?v=20260929-6';
  const $ = id => document.getElementById(id), cv = $('c'), word = $('word');
  const letters = [...document.querySelectorAll('.l')];
  // Q counter in page px: word box (170,120) + svg (210,215), r 98
  const QX = 380, QY = 335, QR = 98;
  // clip for Qubi inside the Q: everything above the counter's centre line (the head leans out over the frame)
  // plus the lower half of the counter (the body stays inside the window)
  const arc = Array.from({ length: 25 }, (_, i) => { const a = Math.PI * i / 24; return `${(QX + QR * Math.cos(a)).toFixed(1)}px ${(QY + QR * Math.sin(a)).toFixed(1)}px`; });
  const WINDOW = `polygon(0 0, 1440px 0, 1440px ${QY}px, ${arc.join(', ')}, 0 ${QY}px)`;
  // transform that lays the wordmark exactly over the "Qubi" of the headline (same font size, same baseline)
  const toHeadline = () => {
    const em = $('qw'), r = em.getBoundingClientRect(), fs = parseFloat(getComputedStyle(em).fontSize);
    const s = fs / 400, left = 52, right = letters[3].getBBox().x + letters[3].getBBox().width;
    const tx = r.left + r.width / 2 - 170 - s * (left + right) / 2, ty = r.top + .968 * fs - 120 - s * 370;
    return `translate(${tx}px, ${ty}px) scale(${s})`;
  };
  const q = createStage(cv).add({ x: QX, y: 720, size: 250 });
  loopScene(() => {
    letters.forEach(l => l.classList.remove('in'));
    word.style.transition = 'none'; word.style.transform = ''; word.classList.remove('gone'); word.offsetWidth; word.style.transition = '';
    $('hole').setAttribute('fill', '#fff'); $('qw').classList.remove('on');
    ['s1', 's2', 'sub'].forEach(id => $(id).classList.add('hide'));
    q.reset(QX, 720); cv.style.clipPath = WINDOW;
  }, async (wait, live) => {
    for (const l of letters) { await wait(180); l.classList.add('in'); }      // green letters drop in
    await wait(700); $('hole').setAttribute('fill', '#f1f8e6');               // the Q's window lights up
    await wait(250); await q.rise(404, .9); if (!live()) return;              // Qubi leans out of the Q
    await q.lookAround(); if (!live()) return;
    await q.wave(2); if (!live()) return;
    cv.style.clipPath = '';
    setTimeout(() => { if (live()) word.style.transform = toHeadline(); }, 200);   // the wordmark shrinks into the headline
    await q.jumpTo(720, 548, { height: 170, dur: .9 }); if (!live()) return;
    $('qw').classList.add('on'); word.classList.add('gone');
    $('s1').classList.remove('hide'); $('s2').classList.remove('hide');
    await wait(300); $('sub').classList.remove('hide');
    await q.nod();
  }, 12000);
</script>
</body>
</html>
