<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Hero A2 · 開蓋喚醒（正面）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-base.css?v=20260929-6">
<style>
  /* A2: front view. The lid of the real Acer laptop opens towards us, the screen glows, and the 3D Qubi pops up
     from behind the screen and waves at us over the top of it */
  .copy{position:absolute;left:110px;top:300px;width:560px;z-index:4}
  .copy.hide{transform:translateX(-40px)}
  .scene{position:absolute;left:690px;top:250px;width:620px;height:452px;perspective:1800px;perspective-origin:50% 20%;z-index:2}
  .base{position:absolute;left:0;top:338px;width:620px;height:114px;background:url(laptop.png) 0 -338px/620px 452px no-repeat}
  .lid{position:absolute;left:0;top:0;width:620px;height:342px;background:url(laptop.png) 0 0/620px 452px no-repeat;
    transform-origin:50% 100%;transform:rotateX(-88deg);transition:transform 1.4s cubic-bezier(.3,.7,.2,1)}
  .lid.open{transform:rotateX(0)}
  .glow{position:absolute;left:64px;top:14px;width:491px;height:302px;border-radius:4px;
    background:radial-gradient(60% 70% at 50% 45%,rgba(160,236,230,.9),rgba(90,200,200,.25) 70%,transparent),#0f1a1c;opacity:0;transition:opacity 1s}
  .lid.lit .glow{opacity:.92}
  .shadow{position:absolute;left:700px;top:688px;width:600px;height:26px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.15),transparent 70%)}
  canvas{position:absolute;left:0;top:0;width:1440px;height:810px;z-index:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="stage">
  <div class="copy t hide" id="copy"><h1>Acer <em>Qubi</em><br>全新亮相!</h1>
    <p class="sub">新一代 Acer Intelligence Space 與 Acer Qubi<br>就在你的電腦裡，幫你做得更多、更懂你。</p></div>
  <div class="shadow"></div>
  <canvas id="c"></canvas>
  <div class="scene"><div class="base"></div><div class="lid" id="lid"><div class="glow"></div></div></div>
  <span class="tag">A2 · 開蓋喚醒（正面）</span>
</div>
<script type="module">
  import { createStage, loopScene } from './qubi3d.js?v=20260929-6';
  const $ = id => document.getElementById(id), cv = $('c');
  const q = createStage(cv).add({ x: 1000, y: 520, size: 220 });
  loopScene(() => {
    q.reset(1000, 520); q.root.visible = false;
    $('lid').className = 'lid'; $('copy').classList.add('hide');
  }, async (wait, live) => {
    await wait(400); $('lid').classList.add('open');                 // the lid opens towards us
    await wait(1100); $('lid').classList.add('lit');                 // the screen glows
    await wait(400); q.root.visible = true; await q.rise(270, .9);   // Qubi pops up from behind the screen
    if (!live()) return; $('copy').classList.remove('hide');
    await q.wave(3); if (!live()) return;                            // and waves over the top of it
    await q.tilt(-1, .5); if (!live()) return;
    await q.nod();
  }, 10000);
</script>
</body>
</html>
