<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Hero A · 開蓋喚醒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-base.css">
<style>
  /* A: 3/4 view, the lid swings open on its hinge, the screen glows green, Qubi rises behind the lid; headline on the left */
  .copy{position:absolute;left:110px;top:270px;width:560px}
  .copy.hide{transform:translateX(-40px)}
  .scene{position:absolute;left:720px;top:150px;width:620px;height:560px;perspective:1600px}
  .rig{position:absolute;left:0;top:0;width:618px;height:451px;transform:rotateX(14deg) rotateY(-28deg) rotateZ(1deg);transform-style:preserve-3d;transform-origin:50% 75%}
  .base{position:absolute;left:0;top:338px;width:618px;height:113px;background:url(laptop.png) 0 -338px/618px 451px no-repeat}
  .lid{position:absolute;left:0;top:0;width:618px;height:342px;background:url(laptop.png) 0 0/618px 451px no-repeat;
    transform-origin:50% 100%;transform:rotateX(-86deg);transition:transform 1.4s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden}
  .lid.open{transform:rotateX(0)}
  .glow{position:absolute;left:62px;top:14px;width:486px;height:276px;border-radius:6px;background:radial-gradient(60% 70% at 50% 45%,rgba(166,226,46,.85),rgba(131,184,26,.2) 70%,transparent);
    opacity:0;transition:opacity 1s}
  .lid.lit .glow{opacity:1}
  .qubi{left:225px;top:40px;transform:translateZ(-40px) translateY(170px);transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
  .qubi.up{transform:translateZ(-40px) translateY(-150px)}
  .shadow{position:absolute;left:760px;top:650px;width:560px;height:26px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.16),transparent 70%)}
</style>
</head>
<body>
<div class="stage">
  <div class="copy t hide" id="copy"><h1>Acer <em>Qubi</em><br>全新亮相!</h1>
    <p class="sub">新一代 Acer Intelligence Space 與 Acer Qubi<br>就在你的電腦裡，幫你做得更多、更懂你。</p></div>
  <div class="shadow"></div>
  <div class="scene"><div class="rig">
    <img class="qubi" id="qubi" src="qubi.png" alt="Qubi">
    <div class="base"></div>
    <div class="lid" id="lid"><div class="glow"></div></div>
  </div></div>
  <span class="tag">A · 開蓋喚醒</span>
</div>
<script src="hero-base.js"></script>
<script>
  heroTimeline(() => { $('lid').className = 'lid'; $('qubi').classList.remove('up'); $('copy').classList.add('hide'); }, [
    [500, () => $('lid').classList.add('open')],        // lid swings open
    [1500, () => $('lid').classList.add('lit')],         // screen glows
    [2200, () => $('qubi').classList.add('up')],         // Qubi wakes up behind the lid
    [2700, () => $('copy').classList.remove('hide')],    // headline slides in from the left
  ], 9000);
</script>
</body>
</html>
