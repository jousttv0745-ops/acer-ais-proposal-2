<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>Hero D · 字體主視覺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-base.css">
<style>
  /* D: type-led. A huge "Qubi" wordmark drops in letter by letter; the counter of the Q turns green and Qubi
     rises out of it; then the wordmark shrinks up and the laptop + copy come in below */
  .word{position:absolute;left:50%;top:120px;width:1100px;height:420px;margin-left:-550px;transform-origin:50% 0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .word.small{transform:translateY(-40px) scale(.48)}
  .word svg{width:100%;height:100%;overflow:visible}
  .word .l{transform-box:fill-box;transform-origin:50% 100%;transform:translateY(-260px);opacity:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .3s}
  .word .l.in{transform:none;opacity:1}
  .hole{transition:fill .5s}
  .copy{position:absolute;left:0;right:0;top:300px;text-align:center}
  .copy h1{font-size:60px}
  .copy.hide{transform:translateY(20px)}
  .laptop{position:absolute;left:50%;top:470px;width:420px;margin-left:-210px;transition:opacity .8s,transform 1s cubic-bezier(.2,.8,.2,1)}
  .laptop.hide{opacity:0;transform:translateY(60px)}
</style>
</head>
<body>
<div class="stage">
  <div class="word" id="word">
    <svg viewBox="0 0 1100 420">
      <defs><clipPath id="counter"><circle cx="210" cy="215" r="98"/></clipPath></defs>
      <!-- Q: ring + tail, counter is a separate circle so it can change colour and hold Qubi -->
      <g class="l" id="lq">
        <circle cx="210" cy="215" r="158" fill="#1a1d23"/>
        <circle class="hole" id="hole" cx="210" cy="215" r="98" fill="#fff"/>
        <g clip-path="url(#counter)"><image id="qin" href="qubi.png" x="140" y="330" width="140" height="162"/></g>
        <path d="M285 300 L385 395 L330 410 L240 330 Z" fill="#1a1d23"/>
      </g>
      <text class="l" x="400" y="370" style="font:900 400px Montserrat,sans-serif;fill:#83b81a">u</text>
      <text class="l" x="660" y="370" style="font:900 400px Montserrat,sans-serif;fill:#1a1d23">b</text>
      <text class="l" x="920" y="370" style="font:900 400px Montserrat,sans-serif;fill:#1a1d23">i</text>
    </svg>
  </div>
  <div class="copy t hide" id="copy"><h1>Acer <em>Qubi</em> 全新亮相!</h1><p class="sub">新一代 Acer Intelligence Space 與 Acer Qubi 就在你的電腦裡，幫你做得更多、更懂你。</p></div>
  <img class="laptop hide" id="laptop" src="laptop.png" alt="">
  <span class="tag">D · 字體主視覺</span>
</div>
<script src="hero-base.js"></script>
<script>
  const letters = [...document.querySelectorAll('.l')];
  heroTimeline(() => {
    letters.forEach(l => l.classList.remove('in')); $('word').classList.remove('small');
    $('hole').setAttribute('fill', '#fff'); $('qin').style.transition = 'none'; $('qin').setAttribute('y', 330);
    $('copy').classList.add('hide'); $('laptop').classList.add('hide');
  }, [
    ...letters.map((l, i) => [300 + i * 180, () => l.classList.add('in')]),       // letters drop in
    [1400, () => $('hole').setAttribute('fill', '#83b81a')],                       // the Q's counter turns green
    [1700, () => { const q = $('qin'); q.style.transition = 'y .9s cubic-bezier(.3,1.5,.5,1)'; q.setAttribute('y', 150); }], // Qubi rises out of the Q
    [3200, () => $('word').classList.add('small')],                                // wordmark moves up
    [3600, () => { $('copy').classList.remove('hide'); $('laptop').classList.remove('hide'); }],
  ], 9500);
</script>
</body>
</html>
