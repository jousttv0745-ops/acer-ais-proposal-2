<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>L1 整頁 Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* the full L1 wireframe as one 1440-wide strip, shown scaled down in the deck; labels and chips are sized for that */
  html,body{margin:0;width:1440px;background:#fff;font-family:'Noto Sans TC',sans-serif}
  .label{box-sizing:border-box;height:56px;padding:0 24px;display:flex;align-items:center;gap:16px;background:#f1f8e6;border-top:2px solid #83b81a;
    font-size:26px;font-weight:900;color:#1a1d23}
  .label i{font-style:normal;font-weight:500;color:#6d7385}
  .wf{box-sizing:border-box;border-radius:0 !important;border-left:0 !important;border-right:0 !important}
  .wf span{font-size:24px !important}
  .wf b{font-size:24px !important;padding:4px 12px !important;left:10px !important;top:10px !important}
</style>
</head>
<body>
<div id="strip"></div>
<script src="../spec-data.js?v=20260925-4"></script>
<script src="../wireframe.js?v=20260925-4"></script>
<script>
  const S = window.SPEC, WF = window.Wireframe;
  document.head.insertAdjacentHTML('beforeend', `<style>${WF.css}</style>`);
  document.getElementById('strip').innerHTML = WF.stack().map(s => {
    const l1 = S.l1.find(x => x.id === s.id);
    return `<div class="label">${s.id} ${l1.seg}<i>≈${s.h.toLocaleString('en-US')}px</i></div>` + WF.segment(s.id, '1440px');
  }).join('');
</script>
</body>
</html>
