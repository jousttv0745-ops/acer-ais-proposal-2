<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIS Landing Page Spec v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/deck.css?v=20260926-6">
</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="chapters" id="chapters" aria-label="章節"></nav>
    <div class="count" id="count"></div>
  </header>

  <section class="cover off" id="cover"></section>
  <section class="intro off" id="intro"></section>
  <div id="windows"></div>

  <div class="cathead" id="cathead"></div>
  <div class="chips" id="chips"></div>
  <div class="labels" id="labels"></div>
  <svg class="wire" id="wire" viewBox="0 0 1920 1080"></svg>
  <div class="caption" id="caption"></div>
  <aside class="callout" id="callout"></aside>
  <section class="panel" id="panel"></section>

  <footer class="bottom">
    <div class="bar" id="bar"></div>
    <div class="hint"><kbd>←</kbd> <kbd>→</kbd> 切換　<kbd>F</kbd> 全螢幕</div>
  </footer>
  <div class="draft" id="draft"></div>
</div>

<script src="spec-data.js?v=20260926-6"></script>
<script src="wireframe.js?v=20260926-6"></script>
<script src="deck.config.js?v=20260926-6"></script>
<script src="engine/deck.js?v=20260926-6"></script>
</body>
</html>
